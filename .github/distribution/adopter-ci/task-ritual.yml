# Explicit opt-in metadata checks; application checks keep their own workflow.
name: Adopter Task metadata

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: adopter-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  task-ritual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - name: Check out trusted base controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify installed metadata controls, Task ledger and retarget freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f .github/scripts/check-adopter-ci.py ]; then
            echo "UNCHECKABLE: accept addon installation before activating required metadata checks" >&2
            exit 2
          fi
          python3 -I .github/scripts/check-adopter-ci.py check --root .
