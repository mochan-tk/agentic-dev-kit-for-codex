name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# NON-EXECUTABLE Phase 0 compatibility markers; isolated steps below are authoritative.
# run: python3 .github/scripts/check-phase0-contracts.py
# run: python3 .github/scripts/check-repository-policy.py
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Phase 0 contracts
        run: python3 -I .github/scripts/check-phase0-contracts.py
      - name: Validate live repository policy
        run: python3 -I .github/scripts/check-repository-policy.py
      - name: Install and verify pinned CI tools
        run: python3 -I .github/scripts/install-ci-tools.py --lock .github/governance/ci-tools.lock.v1.json --destination "$RUNNER_TEMP/agentic-ci-tools" --check-repository
      - name: Validate conformance catalog synchronization
        run: python3 -I .github/scripts/conformance-catalog.py check
      - name: Validate repository Action pins
        run: bash .github/scripts/check-action-pins.sh
      - name: Test Action-pin guard
        run: bash .github/scripts/tests/test-action-pins.sh
      - name: Validate repository workflow permissions
        run: bash .github/scripts/check-workflow-permissions.sh
      - name: Test workflow-permission guard
        run: bash .github/scripts/tests/test-workflow-permissions.sh
      - name: Compile Python checks
        run: python3 -I -m compileall -q .github/scripts tests/conformance

  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repository conformance tests
        run: python3 -I -m unittest discover -s tests/conformance -p 'test_*.py'
